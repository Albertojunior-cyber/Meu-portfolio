<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BELTY CHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0d1117;color:#fff}
.topo{background:#00c853;padding:15px;text-align:center;font-weight:bold;font-size:16px;border-radius:0 0 20px 20px;display:flex;justify-content:center;align-items:center;gap:8px;color:#000}
.topo.badge{background:#000;color:#00c853;padding:2px 8px;border-radius:12px;font-size:12px}
.proverbio{background:#ffc107;color:#000;padding:10px;text-align:center;font-size:13px;font-weight:600}
.tela{display:none;min-height:100vh}
.tela.ativa{display:block}
h1{text-align:center;font-size:24px;margin:30px 0 8px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:30px}
.btn-verde{background:#00c853;border:none;padding:15px;width:90%;border-radius:12px;color:#000;font-weight:bold;font-size:15px;margin:10px auto;display:block}
.btn-cinza{background:#1e242d;border:2px solid #00c853;color:#fff;padding:15px;width:90%;border-radius:12px;font-weight:bold;font-size:15px;margin:10px auto;display:block}
input,select{width:90%;padding:15px;margin:10px auto;display:block;background:#1e242d;border:1px solid #2a3441;color:#aaa;border-radius:12px;font-size:15px}
.perfil{display:flex;align-items:center;justify-content:space-between;padding:15px;background:#1a1f29}
.perfil-info{display:flex;align-items:center;gap:12px}
.foto{width:50px;height:50px;border-radius:50%;border:2px solid #00c853}
.nome{font-weight:bold}.status{color:#00c853;font-size:12px}
.chat-area{padding:15px;height:50vh;overflow-y:auto;padding-bottom:90px}
.msg-eu{background:#00c853;color:#000;padding:10px 14px;border-radius:18px 18px 0 18px;float:right;clear:both;margin:6px 0;max-width:70%}
.msg-outro{background:#2a3441;padding:10px 14px;border-radius:18px 18px 18px 0;float:left;clear:both;margin:6px 0;max-width:70%}
label{color:#00c853;font-size:13px;font-weight:600;margin:10px 0 5px 5%;display:flex;align-items:center;gap:6px}
.barra-baixo{display:flex;gap:10px;padding:12px;background:#0d1117;position:fixed;bottom:0;width:100%}
.barra-baixo input{flex:1;background:#1e242d;border-radius:25px;padding:14px;border:none;color:#fff}
.btn-circulo{background:#2a3441;border:none;width:45px;height:45px;border-radius:50%;font-size:20px;color:#888;display:flex;align-items:center;justify-content:center}
.btn-ligar{color:#00c853}
</style>
</head>
<body>

<!-- TELA 1 -->
<div class="tela ativa" id="tela1">
  <div class="topo">🌍 BELTY CHAT</div>
  <div style="padding:40px 20px">
    <h1>Bem-vindo ao Belty<br>Chat</h1>
    <p class="sub">Converse com o mundo em 67 idiomas</p>
    <button class="btn-verde" onclick="mostrar('tela3')">CRIAR NOVA CONTA</button>
    <button class="btn-cinza" onclick="mostrar('tela2')">ENTRAR NA CONTA</button>
  </div>
</div>

<!-- TELA 3 -->
<div class="tela" id="tela3">
  <div class="topo">🌍 BELTY CHAT</div>
  <div style="padding:20px 0">
    <input placeholder="Nome Completo">
    <select id="pais"></select>
    <input placeholder="Número de Telefone">
    <input placeholder="Email">
    <input type="password" placeholder="Senha">
    <select><option>Como conheceu o Belty Chat?</option></select>
    <label style="color:#aaa;font-size:12px"><input type="checkbox"> Eu concordo com os Termos</label>
    <button class="btn-verde" onclick="mostrar('telaChat')">AVANÇAR</button>
  </div>
</div>

<!-- TELA CHAT -->
<div class="tela" id="telaChat">
  <div class="topo">🌍 BELTY CHAT <span class="badge">68</span></div>
  <div class="proverbio" id="proverbio"></div>
  
  <div class="perfil">
    <div class="perfil-info">
      <img src="https://i.pravatar.cc/100" class="foto">
      <div><div class="nome">Magalex</div><div class="status">+258 84 123 4567 online</div></div>
    </div>
    <button class="btn-circulo btn-ligar" onclick="alert('Ligando...')">📞</button>
  </div>

  <div style="padding:0 5%">
    <label>🇲🇿 EU FALO:</label>
    <select id="minhaLingua"></select>
    <label>🌍 ENVIAR PARA:</label>
    <select id="linguaDestino"></select>
  </div>

  <div class="chat-area" id="chat"></div>

  <div class="barra-baixo">
    <button class="btn-circulo" onclick="gravarVoz()">🎤</button>
    <input id="msgInput" placeholder="Escreve mensagem...">
    <button class="btn-circulo" onclick="enviarMsg()">➤</button>
  </div>
</div>

<script>
function mostrar(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}

// 55 AFRICA + 12 FORA = 67 PAÍSES
const paises = [
"+27 🇿🇦 África do Sul","+244 🇦🇴 Angola","+213 🇩🇿 Argélia","+229 🇧🇯 Benim","+267 🇧🇼 Botsuana",
"+226 🇧🇫 Burkina Faso","+257 🇧🇮 Burundi","+238 🇨🇻 Cabo Verde","+237 🇨🇲 Camarões","+235 🇹🇩 Chade",
"+269 🇰🇲 Comores","+225 🇨🇮 Costa do Marfim","+253 🇩🇯 Djibuti","+20 🇪🇬 Egito","+240 🇬🇶 Guiné Equatorial",
"+291 🇪🇷 Eritreia","+268 🇸🇿 Eswatini","+251 🇪🇹 Etiópia","+241 🇬🇦 Gabão","+220 🇬🇲 Gâmbia",
"+233 🇬🇭 Gana","+224 🇬🇳 Guiné","+245 🇬🇼 Guiné-Bissau","+254 🇰🇪 Quénia","+266 🇱🇸 Lesoto",
"+231 🇱🇷 Libéria","+218 🇱🇾 Líbia","+261 🇲🇬 Madagáscar","+265 🇲🇼 Maláui","+223 🇲🇱 Mali",
"+212 🇲🇦 Marrocos","+222 🇲🇷 Mauritânia","+230 🇲🇺 Maurícia","+258 🇲🇿 Moçambique","+264 🇳🇦 Namíbia",
"+227 🇳🇪 Níger","+234 🇳🇬 Nigéria","+250 🇷🇼 Ruanda","+290 🇸🇹 São Tomé e Príncipe","+221 🇸🇳 Senegal",
"+248 🇸🇨 Seicheles","+232 🇸🇱 Serra Leoa","+252 🇸🇴 Somália","+211 🇸🇸 Sudão do Sul","+249 🇸🇩 Sudão",
"+255 🇹🇿 Tanzânia","+228 🇹🇬 Togo","+216 🇹🇳 Tunísia","+256 🇺🇬 Uganda","+260 🇿🇲 Zâmbia","+263 🇿🇼 Zimbábue",
// 12 FORA
"+351 🇵🇹 Portugal","+33 🇫🇷 França","+86 🇨🇳 China","+44 🇬🇧 Inglaterra","+966 🇸🇦 Arábia Saudita",
"+972 🇮🇱 Israel","+81 🇯🇵 Japão","+55 🇧🇷 Brasil","+1 🇺🇸 América","+34 🇪🇸 Espanha","+30 🇬🇷 Grécia","+39 🇮🇹 Itália"
];

// 67 IDIOMAS
const idiomas = {
"zu":"🇿🇦 Zulu - África do Sul","af":"🇿🇦 Afrikaans - África do Sul","kmb":"🇦🇴 Kimbundu - Angola","pt-ao":"🇦🇴 Português - Angola",
"ar-dz":"🇩🇿 Árabe - Argélia","fon":"🇧🇯 Fon - Benim","tn":"🇧🇼 Setswana - Botsuana","mos":"🇧🇫 Moore - Burkina Faso",
"rn":"🇧🇮 Kirundi - Burundi","kea":"🇨🇻 Crioulo - Cabo Verde","dua":"🇨🇲 Duala - Camarões","sre":"🇹🇩 Sara - Chade",
"swc":"🇰🇲 Shikomori - Comores","dyu":"🇨🇮 Dioula - Costa do Marfim","aa":"🇩🇯 Afar - Djibuti","ar-eg":"🇪🇬 Árabe - Egito",
"es-gq":"🇬🇶 Espanhol - Guiné Equatorial","ti":"🇪🇷 Tigrínia - Eritreia","ss":"🇸🇿 SiSwati - Eswatini","am":"🇪🇹 Amárico - Etiópia",
"fr-ga":"🇬🇦 Francês - Gabão","mnk":"🇬🇲 Mandinka - Gâmbia","ak":"🇬🇭 Akan - Gana","ff":"🇬🇳 Fula - Guiné","sus":"🇬🇳 Susu - Guiné",
"pov":"🇬🇼 Crioulo - Guiné-Bissau","bsa":"🇱🇷 Bassa - Libéria","ar-ly":"🇱🇾 Berbere - Líbia","mg":"🇲🇬 Malgaxe - Madagáscar",
"ny":"🇲🇼 Chichewa - Maláui","bm":"🇲🇱 Bambara - Mali","ar-ma":"🇲🇦 Árabe - Marrocos","ar-mr":"🇲🇷 Hassaniya - Mauritânia",
"mfe":"🇲🇺 Crioulo - Maurícia","pt-mz":"🇲🇿 Português - Moçambique","ts":"🇲🇿 Xironga - Moçambique","ng":"🇳🇦 Oshiwambo - Namíbia",
"ha":"🇳🇪 Hausa - Níger","yo":"🇳🇬 Iorubá - Nigéria","rw":"🇷🇼 Kinyarwanda - Ruanda","cri":"🇸🇹 Forro - São Tomé",
"wo":"🇸🇳 Wolof - Senegal","crs":"🇸🇨 Crioulo - Seicheles","kri":"🇸🇱 Krio - Serra Leoa","so":"🇸🇴 Somali - Somália",
"din":"🇸 Dinka - Sudão do Sul","ar-sd":"🇸🇩 Árabe - Sudão","sw-tz":"🇹🇿 Suaili - Tanzânia","ee":"🇹🇬 Ewe - Togo",
"ar-tn":"🇹🇳 Árabe - Tunísia","lg":"🇺🇬 Luganda - Uganda","bem":"🇿🇲 Bemba - Zâmbia","sn":"🇿🇼 Shona - Zimbábue",
// 12 FORA
"pt-pt":"🇵🇹 Português - Portugal","fr":"🇫🇷 Francês - França","zh":"🇨🇳 Mandarim - China","en-gb":"🇬🇧 Inglês - Inglaterra",
"ar-sa":"🇸🇦 Árabe - Arábia Saudita","he":"🇮🇱 Hebraico - Israel","ja":"🇯🇵 Japonês - Japão","pt-br":"🇧🇷 Português - Brasil",
"en":"🇺🇸 Inglês - América","es":"🇪🇸 Espanhol - Espanha","el":"🇬🇷 Grego - Grécia","it":"🇮🇹 Italiano - Itália"
};

const provverbios = [
"🇪🇹 Amárico: 'ትዕግስት ያሸንፋል' = Paciência vence tudo",
"🇦🇴 Kimbundu: 'Provérbio é o cavalo das palavras'",
"🇿🇦 Zulu: 'Umuntu ngumuntu ngabantu' = Eu sou porque nós somos"
];

paises.forEach(p => document.getElementById('pais').innerHTML += `<option>${p}</option>`);

for(let cod in idiomas){
  document.getElementById('minhaLingua').innerHTML += `<option value="${cod}">${idiomas[cod]}</option>`;
  document.getElementById('linguaDestino').innerHTML += `<option value="${cod}">${idiomas[cod]}</option>`;
}

document.getElementById('proverbio').innerText = provverbios[0];

async function traduzir(texto, de, para){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${de}&tl=${para}&dt=t&q=${encodeURIComponent(texto)}`;
  const res = await fetch(url);
  const data = await res.json();
  return data[0][0][0];
}

async function enviarMsg(){
  const texto = document.getElementById('msgInput').value;
  if(texto.trim() == "") return;
  const de = document.getElementById('minhaLingua').value;
  const para = document.getElementById('linguaDestino').value;
  document.getElementById('chat').innerHTML += `<div class="msg-eu">${texto}</div>`;
  const traduzido = await traduzir(texto, de, para);
  setTimeout(()=>{
    document.getElementById('chat').innerHTML += `<div class="msg-outro">${traduzido}</div>`;
  }, 500);
  document.getElementById('msgInput').value = "";
}

function gravarVoz(){
  alert("Segura e fala 🎤");
}
</script>
</body>
</html>
